[project]
name = "quantai"
version = "0.1.0"
description = "QUANT AI — market intelligence, research and paper-trading system (no live execution by default)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quantai = "quantai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantai*"]

[tool.setuptools.package-data]
quantai = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires outbound access to market-data hosts"]
addopts = "-m 'not network'"
